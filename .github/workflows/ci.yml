name: Shear.ly CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: Checks (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22, 24]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install root dependencies
        run: npm ci --ignore-scripts

      - name: Install analytics dependencies
        run: npm ci --ignore-scripts
        working-directory: analytics-service

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Generate LCOV coverage
        run: npm run test:coverage

      - name: Build Link Service
        run: npm run build

      - name: Build Analytics Service
        run: npm run build
        working-directory: analytics-service

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.run_number }}-${{ matrix.os }}-node${{ matrix.node }}
          path: |
            dist/
            analytics-service/dist/
          if-no-files-found: error
          retention-days: 7

      - name: Upload LCOV coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.run_number }}-${{ matrix.os }}-node${{ matrix.node }}
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 7
