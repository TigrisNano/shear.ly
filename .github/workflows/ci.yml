name: Shear.ly CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: Checks (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22, 24]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install root dependencies
        run: npm ci --ignore-scripts

      - name: Install analytics dependencies
        run: npm ci --ignore-scripts
        working-directory: analytics-service

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Generate LCOV coverage
        run: npm run test:coverage

      - name: Build Link Service
        run: npm run build

      - name: Build Analytics Service
        run: npm run build
        working-directory: analytics-service

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.run_number }}-${{ matrix.os }}-node${{ matrix.node }}
          path: |
            dist/
            analytics-service/dist/
          if-no-files-found: error
          retention-days: 7

      - name: Upload LCOV coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.run_number }}-${{ matrix.os }}-node${{ matrix.node }}
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 7

  publish-docker:
    name: Publish Docker images to GHCR
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Prepare image tags
        id: image
        shell: bash
        run: |
          echo "repo_lc=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Log in to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Link Service
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          push: true
          tags: ghcr.io/${{ steps.image.outputs.repo_lc }}:${{ steps.image.outputs.sha_short }}

      - name: Build and push Analytics Service
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: ./analytics-service
          push: true
          tags: ghcr.io/${{ steps.image.outputs.repo_lc }}-analytics:${{ steps.image.outputs.sha_short }}
