services:
  postgres:
    image: postgres:16
    container_name: shearly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: shearly
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
      - -c
      - wal_keep_size=256MB
      - -c
      - listen_addresses=*
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shearly"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-replica:
    image: postgres:16
    container_name: shearly-postgres-replica
    restart: unless-stopped
    environment:
      PGPASSWORD: replication_password
    command:
      - bash
      - -c
      - |
        if [ ! -s /var/lib/postgresql/data/PG_VERSION ]; then
          until pg_basebackup \
            -h postgres \
            -p 5432 \
            -U replicator \
            -D /var/lib/postgresql/data \
            -Fp -Xs -P -R
          do
            echo "Waiting for primary..."
            sleep 3
          done
        fi

        chown -R postgres:postgres /var/lib/postgresql/data
        chmod 700 /var/lib/postgresql/data

        exec su postgres -c "postgres -c hot_standby=on -c port=5432"
    ports:
      - "5433:5432"
    volumes:
      - postgres_replica_data:/var/lib/postgresql/data
    depends_on:
      postgres:
        condition: service_healthy

  sonarqube-db:
    image: postgres:16
    container_name: shearly-sonarqube-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: sonarqube
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar_password
    volumes:
      - sonarqube_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonarqube"]
      interval: 5s
      timeout: 5s
      retries: 20

  sonarqube:
    image: sonarqube:community
    container_name: shearly-sonarqube
    restart: unless-stopped
    depends_on:
      sonarqube-db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/sonarqube
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar_password
    ports:
      - "9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs

  rabbitmq:
    image: rabbitmq:4-management
    container_name: shearly-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: shear
      RABBITMQ_DEFAULT_PASS: shear_password
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  postgres_replica_data:
  sonarqube_db_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  rabbitmq_data:
