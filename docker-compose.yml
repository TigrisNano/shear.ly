services:
  postgres:
    image: postgres:16
    container_name: shearly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: shearly
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
      - -c
      - wal_keep_size=256MB
      - -c
      - listen_addresses=*
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
    ports:
      - "5432:5432"
    volumes:
      - ./postgres/00_create_replicator.sql:/docker-entrypoint-initdb.d/00_create_replicator.sql:ro
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf
      - ./migrations/001_create_links.sql:/docker-entrypoint-initdb.d/01_create_links.sql:ro
      - ./migrations/002_create_idempotency_keys.sql:/docker-entrypoint-initdb.d/02_create_idempotency_keys.sql:ro
      - ./analytics-service/migrations/001_create_analytics.sql:/docker-entrypoint-initdb.d/03_create_analytics.sql:ro
      - ./analytics-service/migrations/002_create_processed_events.sql:/docker-entrypoint-initdb.d/04_create_processed_events.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shearly"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-replica:
    image: postgres:16
    container_name: shearly-postgres-replica
    restart: unless-stopped
    environment:
      PGPASSWORD: replication_password
    command:
      - bash
      - -c
      - |
        if [ ! -s /var/lib/postgresql/data/PG_VERSION ]; then
          until pg_basebackup \
            -h postgres \
            -p 5432 \
            -U replicator \
            -D /var/lib/postgresql/data \
            -Fp -Xs -P -R
          do
            echo "Waiting for primary..."
            sleep 3
          done
        fi

        chown -R postgres:postgres /var/lib/postgresql/data
        chmod 700 /var/lib/postgresql/data

        exec su postgres -c "postgres -c hot_standby=on -c port=5432"
    ports:
      - "5433:5432"
    volumes:
      - postgres_replica_data:/var/lib/postgresql/data
    depends_on:
      postgres:
        condition: service_healthy

  sonarqube-db:
    image: postgres:16
    container_name: shearly-sonarqube-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: sonarqube
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar_password
    volumes:
      - sonarqube_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonarqube"]
      interval: 5s
      timeout: 5s
      retries: 20

  sonarqube:
    image: sonarqube:community
    container_name: shearly-sonarqube
    restart: unless-stopped
    depends_on:
      sonarqube-db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/sonarqube
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar_password
    ports:
      - "9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs

  rabbitmq:
    image: rabbitmq:4-management
    container_name: shearly-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: shear
      RABBITMQ_DEFAULT_PASS: shear_password
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    container_name: shearly-jaeger
    restart: unless-stopped
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3000
      ANALYTICS_GRPC_HOST: analytics-service:50051
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_REPLICA_HOST: postgres-replica
      POSTGRES_REPLICA_PORT: 5432
      POSTGRES_DB: shearly
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: shear
      RABBITMQ_PASSWORD: shear_password
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      postgres-replica:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  analytics-service:
    build:
      context: ./analytics-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      GRPC_PORT: 50051
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: shearly
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
    ports:
      - "50051:50051"
    depends_on:
      postgres:
        condition: service_healthy

  analytics-consumer:
    build:
      context: ./analytics-service
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["node", "dist/consumer.js"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: shearly
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: shear
      RABBITMQ_PASSWORD: shear_password
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  postgres_data:
  postgres_replica_data:
  sonarqube_db_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  rabbitmq_data:
