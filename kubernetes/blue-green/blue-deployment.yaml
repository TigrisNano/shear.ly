apiVersion: apps/v1
kind: Deployment
metadata:
  name: shearly-blue
  labels:
    app: shearly
    environment: blue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shearly
      environment: blue
  template:
    metadata:
      labels:
        app: shearly
        environment: blue
    spec:
      automountServiceAccountToken: false
      containers:
        - name: app
          image: shearly-demo:blue
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
              ephemeral-storage: "64Mi"
            limits:
              memory: "128Mi"
