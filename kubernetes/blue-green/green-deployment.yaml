apiVersion: apps/v1
kind: Deployment
metadata:
  name: shearly-green
  labels:
    app: shearly
    environment: green
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shearly
      environment: green
  template:
    metadata:
      labels:
        app: shearly
        environment: green
    spec:
      containers:
        - name: app
          image: shearly-demo:green
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
