apiVersion: apps/v1
kind: Deployment
metadata:
  name: shearly-canary
  labels:
    app: shearly-canary
    version: canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shearly-canary
      version: canary
  template:
    metadata:
      labels:
        app: shearly-canary
        version: canary
    spec:
      containers:
        - name: app
          image: shearly-demo:green
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
