apiVersion: apps/v1
kind: Deployment
metadata:
  name: shearly-stable
  labels:
    app: shearly-canary
    version: stable
spec:
  replicas: 9
  selector:
    matchLabels:
      app: shearly-canary
      version: stable
  template:
    metadata:
      labels:
        app: shearly-canary
        version: stable
    spec:
      automountServiceAccountToken: false
      containers:
        - name: app
          image: shearly-demo:blue
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
              ephemeral-storage: "64Mi"
            limits:
              memory: "128Mi"
