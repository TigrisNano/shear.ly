apiVersion: apps/v1
kind: Deployment
metadata:
  name: shearly-feature-flags
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shearly-feature-flags
  template:
    metadata:
      labels:
        app: shearly-feature-flags
    spec:
      containers:
        - name: app
          image: shearly-feature-flags:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: shearly-feature-flags
---
apiVersion: v1
kind: Service
metadata:
  name: shearly-feature-flags
spec:
  type: NodePort
  selector:
    app: shearly-feature-flags
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30085
