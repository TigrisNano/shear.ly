apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-blue
  labels:
    app: {{ .Release.Name }}
    environment: blue
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
      environment: blue
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
        environment: blue
    spec:
      automountServiceAccountToken: false
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.blue.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
              ephemeral-storage: "64Mi"
            limits:
              memory: "128Mi"
