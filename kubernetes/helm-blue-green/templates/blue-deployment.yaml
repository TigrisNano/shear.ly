apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-blue
  labels:
    app: {{ .Release.Name }}
    environment: blue
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
      environment: blue
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
        environment: blue
    spec:
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.blue.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 3000
          env:
            - name: APP_VERSION
              value: blue
